name: release

# Publish a GitHub Release whenever a version tag is pushed.
#   git tag v3.2.0 && git push origin v3.2.0
# CI assembles build/antforth.com with the pinned assembler and attaches it.
# Assemble-only: the build-time ASSERT guards in the .asm (e.g. the $8000
# straddle / window-top checks) are the correctness gate. The full REPL suite
# needs the iz-cpm-banking fork and is intentionally left to a separate CI.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # required for gh release create

env:
  # Pin to the assembler version used for the silicon-verified builds so the
  # released .com is byte-reproducible. Bump in lockstep with the local tool.
  SJASMPLUS_VERSION: v1.23.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache sjasmplus
        id: cache-sjasmplus
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sjasmplus
          key: sjasmplus-${{ env.SJASMPLUS_VERSION }}-${{ runner.os }}

      - name: Build sjasmplus ${{ env.SJASMPLUS_VERSION }}
        if: steps.cache-sjasmplus.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SJASMPLUS_VERSION" --recurse-submodules \
            https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus -j"$(nproc)"
          mkdir -p ~/.local/bin
          cp /tmp/sjasmplus/sjasmplus ~/.local/bin/sjasmplus

      - name: Put sjasmplus on PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Assemble
        run: |
          set -euo pipefail
          sjasmplus --version
          make asm
          ls -l build/antforth.com
          echo "size=$(wc -c < build/antforth.com) bytes"

      - name: Verify banner matches tag
        run: |
          set -euo pipefail
          # Guard against a tag/banner mismatch (e.g. tagging v3.3.0 without
          # bumping the src/antforth.asm banner). Assert the built artifact
          # itself carries "AntForth <tag>".
          if ! grep -aq "AntForth ${GITHUB_REF_NAME} " build/antforth.com; then
            echo "::error::Banner in build/antforth.com does not match tag ${GITHUB_REF_NAME}."
            echo "Expected the binary to contain: AntForth ${GITHUB_REF_NAME}"
            echo "Found banner string:"
            strings build/antforth.com | grep -i 'AntForth v' || true
            exit 1
          fi
          echo "Banner OK: build/antforth.com carries AntForth ${GITHUB_REF_NAME}"

      - name: Stage versioned asset
        run: |
          set -euo pipefail
          cp build/antforth.com "antforth-${GITHUB_REF_NAME}.com"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Mark rc/beta tags (v3.2.0-rc1) as pre-releases automatically.
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "antforth-${GITHUB_REF_NAME}.com" \
            --title "antforth ${GITHUB_REF_NAME}" \
            --generate-notes \
            $PRERELEASE
